r5l:
  osd_name: "R5L"            # OSD top-left reads R5L / SHOEYS (goggle DVR of the analog feed)
  camera: "analog, PAL: goggle DVR is 720x576 50 fps MJPEG (5:4), PCM audio. Daylight raw YAVG 103-113 / SATAVG 24-32 (2026-10-02 maiden) - well exposed, no tonal grade needed"
  sources: [dvr]             # only the goggle DVR so far (Thumb/hd never recorded on this airframe yet). Add hd when a Thumb rides along.
  dvr_aspect: "5:4"          # 720x576, SAR 1:1
  grade: chroma              # chroma NR only; tonal work in --post (measured)
  osd_cols: "n/a"            # template full keeps all 30; hero60 on this 5:4 feed cuts SHOEYS to EYS and the battery column mid-digit (tested 2026-10-02)
  template: full             # 100% FOV panel 1080x864 centered in the hero band; OSD + props intact
  notes: "6S 5in freestyle. Rekon 5 Lite hardware on a Grinderino frame since 2026-10-02 (maiden 2026-10-02: VID00052/53 in inbox/grinderino, 6:38 + 5:12 flights). Inverted-moment finder: .claude/skills/reel-shotlist/scripts/invertscan.py (top vs bottom band B-G on the 360p proxy) lists every roll/loop apex; cross-check with 0.25 s sheets, the apexes with the skyline upside down are the money frames. Analog breakup bursts of 0.5-1.5 s sit between tricks (static bands, full mono frames); scout cut-ins at 0.25 s. signalstats on a raw-MJPEG input seek ALWAYS reports the first decoded frame as SATAVG 0 - measurement artifact, the rendered segment's first frame is fine (30.6 measured); judge mono cut-ins on the rendered segment, not the raw seek. Finishing 2026-10-02: per-seg spread 103-110 YAVG raw, trims only on the two low segs (eq brightness 0.024 / 0.016), shared curve 0/0 0.28/0.26 0.72/0.74 1/1 + saturation 1.05. Flight ends with a landing at the pilot's feet then the STATS page within 0.3 s - end the reel on the STATS flash."

cinebot30:
  osd_name: "CINEBOT30"
  camera: "Caddx Ratel 2, factory PAL: DVR is 720x576 50fps HEVC (5:4). If the pilot switches it to NTSC, DVR becomes 720x480 59.94 - change dvr_aspect to 3:2 then. DVR audio is a clipped motor wall - useless for sync"
  sources: [hd, dvr, ctrl]   # hero = RunCam Thumb 2, 4K60 16:9, Gyroflow-stabilized before inbox
  hd_aspect: "16:9"
  dvr_aspect: "5:4"          # 720x576, SAR 1:1
  grade: none                # confirmed 2026-09-08: ungraded PiP reads fine at 230px, already saturated
  osd_cols: "???"            # only matters if the DVR ever heroes
  template: three            # use hero+ctrl (no PiP) for flights without DVR
  notes: "6S. GoPro chest cam writes a bogus -180 rotation tag: use --ctrl-flip; --ctrl-y 240 lands the radio in the panel. Sync: visync.py for DVR then CONFIRM with lagfit.py (composition matching across the FOV gap misleads by ~1s); GoPro offsets MUST be confirmed with disarm-edge/punch anchors (reel-sync SKILL) — an unconfirmed onset_sync peak was 70s wrong on 0018; plain audio sync fails in wind. No DVR clock drift (lagfit-verified flat on 0019). Shotlist on 360px work/ proxies with --fps 5 --dead-ydif 3 --static-ydif 60. three template validated 2026-09-08 (0019 farm reel); render with --dvr-y 170 for IG."

whdoop:
  osd_name: "WHDOOP"         # OSD top-left reads SHOEYS / WHDOOP (goggle DVR of the O4 feed)
  camera: "DJI O4 wide + MP66 gyro since 2026-09-30 (was DJI O4 4K unit). Onboard = 1080p59.94 HEVC Main10 (yuv420p10le) 16:9"
  sources: [o4, dvr, ctrl]   # hero = O4 onboard (1080p59.94 10-bit since 2026-09-30; 4K59.94 on the older unit); dvr = goggle DVR 1080p60 with OSD; ctrl = chest GoPro 4:3 29.97 (present on outings, not home launches)
  hd_aspect: "16:9"          # 1920x1080 on the O4 wide unit (3840x2160 on the old 4K unit)
  dvr_aspect: "16:9"
  grade: none
  osd_cols: "n/a"            # OSD only on the goggle DVR; onboard hero is clean
  template: three             # with GoPro: hero + ctrl + DVR PiP (--dvr-h 300, the pilot's call 2026-09-12: the first series' 230 PiP felt small). Without GoPro: two (goggle DVR as bottom panel, --ctrl-y 0, 2026-09-12 city story)
  notes: "2S 85mm LR whoop. No audio on O4 onboard OR goggle DVR: audio sync impossible, use visync + lagfit (same-airframe, peaks 0.9+ at takeoff/landing steps). DVR leads onboard by ~0.5-0.7s (0.53/0.70/0.47 on three flights, flat within each). ctrl panel CONVENTION (pilot 2026-09-19, supersedes 2026-09-12 pilot-POV): VIEWER-HOLDING — controller at panel bottom, antenna up, "the viewer is holding the controller". For a no-tag chest GoPro (2026-09-19 set) that means NO --ctrl-flip and crop from the frame BOTTOM: --ctrl-y 311 (the max for 4:3->1080x810). Sets whose stored orientation is already antenna-down still need the flip to land antenna-up; extract a still and orient until the antenna points up. ctrl sync: no hero audio, so anchor GoPro audio punch edge + VISUAL liftoff (quad LED visible on chest cam) — pre-flight unpacking makes loud false spikes, eyeball the ctrl frame at any candidate (2026-09-12: three false candidates before the real punch at gp 59.6). --ctrl-y 200 lands radio+hands centered (2026-09-12 mount). Mount angle shifts per outing: 2026-09-19 set needed --ctrl-y 0 (radio at top edge of the flipped frame) - preview the exact panel crop (scale=1080:-2,rotate=PI,crop=1080:499:0:Y) before rendering each new GoPro set. Gyro-surgeon before Gyroflow: djgyrofix scan; this unit CAN throw 7-9s long jitter bursts (night dive 0004) -> surgical-hybrid playbook, verify with twitchmap. Scan windows can CONTAIN real tricks — extract the gyro CSV and split ring (high RMS, near-zero mean) from real rotation (sustained means) before bridging (2026-09-15: pinnacle backflip 27.8-28.4 sat inside the flagged 24.1-28.4 'jitter' event; auto bounds would have bridged the flip away — bridged the pure-ring 17.76-26.95 instead, twitch median 0.29px). NEVER bridge mixed windows: bridging the flip windup 26.95-27.7 (real buffet + ring) made shake WORSE (1.41 -> 4.98 px, raw buffet rendered uncorrected); the fix for mixed residual is `fix --apply --sensitivity 1.3` on the bridged file (windup 1.41 -> 1.14, near the real-buffet floor). 2026-09-19: bounded SMOOTHING corrupts mixed windows too, not just bridging - Z-ring events flagged inside power-loop pull-ups, smoothed at default and worse at 1.3, leaked the pitch input into stabilization (pilot: "pulling back on the stick translated into the stabilization"; 3/4 skylight passes). Remedy: `fix -apply -ranges "<pure events only>"` leaving trick windows on raw gyro - tight-window shakescore dropped 16.2->14.5 / 19.4->16.0 / 4.6->2.6 px, cruise unchanged. Rule: an event overlapping a deliberate rotation gets NO correction — promoted to ALL O4/O4 Pro quads (pilot 2026-09-19, see CLAUDE.md workflow step 2; O4 Pro slightly better behaved but same failure mode); sensitivity 1.3 remains right for pure-ring windows away from tricks (flip 67.8 on 0009 came out clean with it). DVR as two-template bottom panel keeps craft name + battery + ALT + fly timer readable at --ctrl-y 0; bottom OSD row (RC/bitrate/goggle %) crops off, acceptable. At --dvr-h 300 PiP the battery/ALT/timer OSD is legible too. Home launches exit/return through the apartment window: shotlist brightness column finds the indoor bounds (see reel-shotlist SKILL). O4 WIDE UNIT (2026-09-30 night dive, 0010/0011): 10-bit HEVC source - Gyroflow's default H.264 NVENC render fails ('Pixel format YUV420P10LE is not supported'); render with -p {codec: H.265/HEVC, use_gpu: true, audio: false, bitrate: 60} as a quoted JSON-ish string (exact flag in work/nd2_sync.md) (~1 min per clip at 1080p, output stays 1920x1080 10-bit, frame count preserved). Auto lens profile = DJI O4 built-in, zero gyro offset. Gyro is CLEAN on this unit: djgyrofix scan found only a pre-takeoff blip and the landing impact, twitchmap on the stab renders medians 0.18-0.22 px with hotspots only at deliberate tricks - no ring bursts, no surgical playbook needed. shakescore raw->stab: bus pass 1.78->1.02, dive 2.40->1.89 px. DVR-leads-onboard offset 0.55 s on both flights (lagfit peaks 0.94-0.997). Night grade: keep the night — small gamma lifts (1.05-1.12) on dark segs toward the reel median, shared gentle lift curve 0/0 0.12/0.13 0.55/0.58 1/1, never equalize lit-street segs down."

