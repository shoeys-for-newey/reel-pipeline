# Per-quad presets. Fill in the ??? fields as each quad gets its first reel.
# osd_name  : craft name as it appears top-left in the DVR OSD (used to identify files)
# sources   : which recordings exist for this quad; first listed is the hero.
#             dvr = analog goggle DVR, hd = RunCam Thumb, ctrl = controller cam (GoPro),
#             o4 = DJI O4 onboard recording. Treat o4 as hd: no grade, probe aspect on
#             the first file. djgyrofix is for Gyroflow only; framing never needs it.
# dvr_aspect: display aspect of the goggle DVR file (ffprobe display_aspect_ratio)
# grade     : preset name in reel-frame/scripts/frame.sh (none | c03)
# osd_cols  : column range on the 30-col Betaflight analog grid that survives the hero crop
# template  : hero60 (single source) | three (HD + controller cam + DVR PiP)

air65:
  osd_name: "AIR65 C"
  camera: "BetaFPV C03 (no menu; grade in post only)"
  sources: [dvr, ctrl]       # ctrl = chest GoPro. Standing sets: B-roll only (framing rarely holds the radio). SEATED sets (2026-10-04, radio on the lap): it holds the radio -> template fullctrl
  dvr_aspect: "3:2"          # 720x480, SAR 1:1, MJPEG 60 fps. PCM track is the VTX audio channel, 65% clipped 0-500 Hz wall, NOT a mic: audio sync impossible (sync.py conf 1.1-1.2 = noise)
  grade: c03
  osd_cols: "6-24"           # only relevant to hero60; full keeps all 30
  template: full             # the pilot's call 2026-09-09: 100% FOV, panel centered in hero band, blur fill. fullctrl (same panel + GoPro sticks panel) when the chest cam holds the radio (first: 2026-10-04)
  notes: "1S. Flights are short; expect 8 to 15 s of usable action per pack. End on the STATS screen or the grass. Chest-GoPro B-roll segments render as hero60 --grade none; pre-cut them with a 2 s decode run-up (GoPro hero input smears on input-seek). This GoPro set has no rotation tag; no flip. 2026-10-01 city set (air65_20261001, 6 segs, 44.0 s, all analog): overcast day raw panel YAVG 77-80 / SATAVG 8-11; c03 alone lands YAVG 95-99 / SAT 8.5-12 (spread 4 luma, no per-segment eq trims needed); finishing pass eq=saturation=1.1 + shared curve 0/0 0.28/0.26 0.72/0.74 1/1 -> 94-98 / 10.5-15. Daytime analog on this cam drops chroma for single frames every 5-10 frames (SATAVG 0): scan per-frame SATAVG at every cut-in (ffmpeg -ss S -t 0.12 signalstats) and nudge the start a frame or two so the first frame of a segment is not mono — the 44.00 opener landed on one. 2026-10-04 seated set (air65_20261004, fullctrl, 6 segs 23.2 s, VID00055/56 + GX010092/93 in D:/drone videos/2026.10.04): CTRL SYNC = LIFTOFF in the chest GoPro: the quad is visible leaving the pavement at the pilot's feet while the motor whine starts (GX010092 39.75-40.07 vs DVR throttle-up 4.1 read off the voltage sag) - at takeoff no other whoop is there. Offsets GoPro = DVR + 35.6 (pack 1) / + 51.8 (pack 2; landing tumble at the pilot's feet, whine end + impact clicks + their hand reaching down 0.2 s after STATS). WRONG FIRST ANSWER 39.1 on pack 1 shipped in v1-v3: a whine spool-down 3.5 s after the pilot's disarm was ANOTHER whoop near the group and the pilot's arm swing after disarm looked like a reach; the pilot (who flew it: landed AND disarmed in a buddy's hands) caught it from the panel. Never anchor on a whine tail unless the quad is visible in the chest cam at that moment, and when the pilot says the panel is wrong, re-measure from scratch. GoPro -180 tag, seated with the radio on the lap: --ctrl-flip --ctrl-y 0 --ctrl-zoom 1.32 = viewer-holding (radio low in the 715 px gapless sticks panel, railing/street at the top). v1 had a 216 px blur strip between the panels; pilot: close it, zoom the GoPro rather than show torso. Grade: raw panel YAVG 70-102 (sun out on pack 1, canopy shade 70 on pack 2), c03 -> 88-118, trims -0.016/-0.024/-0.045/+0.031/+0.06/+0.024 + eq saturation 1.1 + curve 0/0 0.28/0.26 0.72/0.74 1/1 -> 96.6-104.6 (the curve costs 3-5 luma on sub-100 segments, so positive trims need ~+0.02 more than the arithmetic). Rendered-segment first-frame SATAVG check caught one REAL mono cut-in (raw 15.700); nudged 2 frames. 2026-10-05 card 101DSCIM (VID00001/02, indoor venue, whole files framed to VIDxxxxx_reel.mp4 next to the sources on the card at the pilot's ask, not via exports/): DIFFERENT GOGGLE DVR - 1280x720 16:9 MJPEG 28.9 fps, OSD grid fills the full width; full panel = 1080x608 at y 541. Raw well exposed (flying YAVG med 109 / 100, SATAVG 16 / 10.5): c03 gamma 1.25 overshoots to 126 / 117, so graded --grade chroma --post eq=saturation=1.54:contrast=1.03 + curve 0/0 0.28/0.26 0.72/0.74 1/1 (brightness -0.016 on VID00001 only) -> rendered panel 105 / 100, SAT 20 / 13. RULE: raw panel YAVG over ~95 -> skip the c03 gamma lift, keep the x1.4 chroma in --post. VID00001 has no video until 13.3 s (static)."

mb3:
  osd_name: "MB304"          # OSD top-left reads SHOEYS / MB304 (goggle DVR of the O4 feed). Mapped to this key by name 2026-10-04 - confirm with the pilot
  camera: "DJI O4 4K air unit (the unit whdoop flew until 2026-09-30): onboard 3840x2160 59.94 H.264 8-bit 16:9, embedded gyro (wm169, 1978 Hz stored / 989 Hz real)"
  sources: [o4, dvr]         # hero = O4 onboard; dvr = goggle DVR 1920x1080 60 fps H.264 with OSD. NO audio on either. No GoPro yet - add ctrl when one rides along.
  hd_aspect: "16:9"
  dvr_aspect: "16:9"
  grade: none
  osd_cols: "n/a"
  template: two              # O4 hero + goggle DVR as the bottom panel (--ctrl DVR.MOV --ctrl-start S+0.51 --ctrl-y 0, no flip); same as whdoop without GoPro. OSD name/battery/ALT/timer stay legible, bottom OSD row crops off.
  notes: "6S (24.5 V fresh), ~105 s packs. First set 2026-10-03, riverfront: island -> power station -> skyline -> bird chase -> hand catch (mb304_20261003, 27.1 s). Sync: DVR leads onboard 0.51 s (lagfit 0.995-0.999 at t=1/35/99, flat); visync on 360p proxies only conf 1.19, always confirm with lagfit. GYRO IS THE PROBLEM ON THIS FRAME: djgyrofix scan (balanced) flags only the landing impact but reports a 195 deg/s residual floor over 100% of the clip (resonating IMU - soft-mount / props / tune, not metadata); aggressive adds five sub-0.2 s jitter blips. Gyroflow default render made shake WORSE: shakescore cruise 0.15 raw -> 6.17 px stab, skyline 0.47 -> 3.60, bird chase 3.40 -> 6.81. Gyro low-pass (gyro_source.lpf in a .gyroflow project; preset/trim recipe in work/er1003) only halves it: 30 Hz 3.64, 50 Hz 4.73, 100 Hz 6.14 px on the cruise. Raw onboard is already smooth (0.15 px) so the first reel shipped UNSTABILIZED raw hero; lpf30 render kept in work/er1003 for A/B. Re-test after the pilot changes the mount. Day grade: raw hero band YAVG 118-125 (sun pass 138) / SATAVG 10-12 (brick plant 21); finishing eq=saturation=1.1 + curve 0/0 0.28/0.26 0.72/0.74 1/1, sun pass eq brightness -0.045. Bird chase moment: DVR 1:10.0-1:11.2 (gull crosses the centered hero crop at hero 70.25), quad dives after it into the sun glare."

