atlas4:
  osd_name: "ATLAS 4"        # OSD top-left reads ATLAS 4 / SHOEYS (goggle DVR of the O4 Pro feed)
  camera: "DJI O4 Pro (installed 2026-09-08)"
  sources: [o4, dvr, ctrl]   # dvr = goggle DVR 1080p60 16:9 that PILLARBOXES the 4:3 feed; OSD lives in the side pillars (craft name left, battery/ALT/timer right). Keep the full 16:9 frame in the PiP - cropping the pillars loses the OSD. ctrl = chest GoPro 4:3 29.97 on outings (first: 2026-09-21).
  hd_aspect: "4:3"           # 2688x2016 @ 59.94, H.264. No grade, no OSD. .LRF sidecars (960x720 29.97) are timeline-exact proxies - use them for contact sheets and shotlist/visync proxies instead of decoding 4K.
  dvr_aspect: "16:9"
  grade: none
  osd_cols: "n/a"
  template: pip              # hero60 + DVR PiP top-right (--dvr-y 170 --dvr-h 300), validated 2026-09-14 (atlas4_park_dusk). With chest GoPro: three, same PiP flags (validated 2026-09-21 atlas4_20260921). No audio on o4 OR dvr: sync via lagfit (visync first pass agrees ~0.1s); DVR led onboard 1.21s on the first flight, 0.87s on the 2026-09-21 flight - same lead pattern as whdoop, measure per flight. Center lagfit's DVR window at t0h + expected offset or it clamps at +/-3s.
  notes: "6S 4in LR cruiser, 1804 2450KV. Long flights; expect several usable windows per pack. O4 Pro splits recordings at ~3589 MB; segments butt-join exactly (copy-concat with a Windows-path list file) BUT measure each part's DVR offset separately - the 2026-09-13 join was 0.13s off the derived value. First set 2026-09-09: 0004+0005+0006 = one 9:04 flight. Gyro: 2026-09-13 scan was clean on part 1, two sub-0.5s jitter events on part 2 - scan every file, fix --out to work/, skip Gyroflow input fixing when the scan is clean. Mixed-window rule applies (CLAUDE.md step 2): no correction inside deliberate-rotation windows. Gyroflow render of the 4:3 o4 comes out 2688x1512 16:9 (lens-profile crop): hero keeps 53% width not 70 - tile-check off-center subjects. ctrl 2026-09-19+ set (GX010086) carries a -180 tag: viewer-holding = --ctrl-flip --ctrl-y 311 (OPPOSITE flags to the tagless whdoop 2026-09-19 files, same physical mount - preview per set). ctrl sync when GoPro rolls before arm: DVR OSD fly-timer zero pins arm in hero time (timer starts at arm, ticks on the second), then match the arm idle-plateau onset in GoPro band-passed audio; landing can be a MID-AIR DISARM (hero file ends with quad still airborne) so the disarm audio edge may not exist - the 2026-09-21 offset -68.2 came from arm chain + landing visual, +/-0.3."
